name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.7
      - run: ruff check .
      - name: Check the app's JavaScript syntax
        run: for f in serp_drift/assets/*.js; do node --check "$f"; done
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test offline behavior
        run: python -m unittest discover -s tests -v
      - name: Validate sample panel
        run: python -m serp_drift validate --config examples/monitor.example.toml
      - name: Render demo
        run: python -m serp_drift demo --out reports/demo
      - name: Check fixture regeneration
        run: |
          python scripts/generate-fixtures.py
          git diff --exit-code -- serp_drift/assets/example-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-python-${{ matrix.python-version }}
          path: reports/demo/
