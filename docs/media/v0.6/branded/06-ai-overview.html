<script>
  // Fit the canvas to smaller windows when viewing; when rendering, window = canvas, so the scale stays 1.
  (() => {
    const canvas = document.querySelector('.canvas');
    const fit = () => {
      const scale = Math.min(1, innerWidth / canvas.offsetWidth, innerHeight / canvas.offsetHeight);
      canvas.style.setProperty('--view-scale', String(scale));
    };
    fit();
    addEventListener('resize', fit);
  })();
