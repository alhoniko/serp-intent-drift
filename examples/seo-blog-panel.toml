[targets.page]
url = "https://ahrefs.com/seo/keyword-research"
intent = "informational"

[[targets]]
id = "long-tail-keywords"
query = "long tail keywords"
[targets.page]
url = "https://ahrefs.com/blog/long-tail-keywords/"
intent = "informational"

[[targets]]
id = "google-search-operators"
query = "google search operators"
[targets.page]
url = "https://ahrefs.com/blog/google-advanced-search-operators/"
intent = "informational"

[[targets]]
id = "what-are-backlinks"
query = "what are backlinks"
[targets.page]
url = "https://ahrefs.com/blog/what-are-backlinks/"
intent = "informational"

[[targets]]
id = "seo-checklist"
