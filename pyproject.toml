[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "serp-intent-drift"
version = "0.6.0"
description = "Explainable SERP change monitoring with SearchApi, SQLite, and portable reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Niko Alho" }]
dependencies = []
keywords = ["seo", "serp", "search-intent", "monitoring", "searchapi", "ai-overview", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/alhoniko/serp-intent-drift"
Documentation = "https://github.com/alhoniko/serp-intent-drift#readme"
Changelog = "https://github.com/alhoniko/serp-intent-drift/blob/main/CHANGELOG.md"
Issues = "https://github.com/alhoniko/serp-intent-drift/issues"

[project.scripts]
serp-drift = "serp_drift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["serp_drift"]

[tool.hatch.build.targets.sdist]
include = ["/serp_drift", "/tests", "/scripts", "/examples", "/docs", "/.github", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/.gitignore", "/.env.example"]
exclude = ["**/__pycache__", "**/*.pyc", "/docs/media"]

[tool.ruff]
line-length = 170
target-version = "py311"
extend-exclude = ["dist", "reports", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E731", "RUF012", "RUF015", "SIM117"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["serp_drift"]
