<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <title>SERP Intent Drift Monitor · serp-drift</title>
  <link rel="preload" href="/assets/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1"><div class="page"><div class="skeleton" style="width:40%"></div></div></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <dialog class="palette" id="palette" aria-label="Jump to">
    <div class="palette-box">
      <div class="in"><span id="palette-icon"></span><input id="palette-input" type="search" role="combobox" aria-controls="palette-list" aria-expanded="true" aria-label="Search panels, pages and actions" placeholder="Search panels, pages and actions…" autocomplete="off"><span class="kbd">esc</span></div>
      <ul id="palette-list" role="listbox"></ul>
      <div class="foot"><span><span class="kbd">↑ ↓</span>move</span><span><span class="kbd">↵</span>open</span><span><span class="kbd">esc</span>close</span></div>
    </div>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/assets/icons.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/labeling.js"></script>
  <script src="/assets/setup.js"></script>
  <script src="/assets/review.js"></script>
  <script src="/assets/panel.js"></script>
  <script src="/assets/manage.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
